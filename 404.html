<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada | Lima Digital</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
<style>
  .ok { min-height: calc(100vh - 73px); display: flex; align-items: center; padding: 56px 0 72px; }
  .ok-in { max-width: 920px; margin: 0 auto; padding: 0 24px; width: 100%; }
  .ok-cartao { position: relative; background: var(--grafite); border: 1px solid var(--linha); border-radius: var(--raio-g); padding: 56px 56px 48px; overflow: hidden; }
  .ok-cartao::before { content: ""; position: absolute; inset: 0; background: radial-gradient(600px 260px at 12% 0%, rgba(254,106,0,0.16), transparent 70%); pointer-events: none; }
  .ok-cartao > * { position: relative; }
  .ok-rec { display: inline-flex; align-items: center; gap: 8px; font-family: var(--titulo); font-weight: 700; font-size: 16px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--cinza); }
  .ok-rec i { width: 9px; height: 9px; border-radius: 50%; background: var(--laranja); }
  .ok h1 { margin-top: 24px; font-size: clamp(46px, 7.4vw, 88px); text-transform: uppercase; line-height: 0.9; }
  .ok h1 span { color: var(--laranja); }
  .ok-sub { margin-top: 20px; font-size: 20px; color: var(--texto-2); max-width: 34em; }
  .ok-botoes { margin-top: 36px; display: flex; flex-wrap: wrap; gap: 14px; }
  .ok-links { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 16px; }
  @media (max-width: 700px) {
    .ok { padding: 28px 0 48px; align-items: flex-start; }
    .ok-in { padding: 0 16px; }
    .ok-cartao { padding: 40px 24px 32px; }
    .ok-botoes .btn { flex: 1 1 100%; }
  }
</style>
</head>
<body>
<header class="topo">
  <div class="topo-in">
    <a class="marca" href="/" aria-label="Lima Digital, página inicial">
      <img class="marca-ld" src="/img/logo-ld-96.png" alt="" width="64" height="34">
      <span class="marca-nome">Lima Digital</span>
    </a>
    <a class="link" href="/">Ir para o início</a>
  </div>
</header>

<main class="ok">
  <div class="ok-in">
    <div class="ok-cartao">
      <span class="ok-rec"><i aria-hidden="true"></i>Erro 404</span>
      <h1>Essa página <span>saiu do enquadramento.</span></h1>
      <p class="ok-sub">O endereço não existe ou mudou de lugar. Volte para o início ou fale direto com a Lima Digital.</p>
      <div class="ok-botoes">
        <a class="btn btn-laranja" href="/">Voltar ao início</a>
        <a class="btn btn-contorno" href="https://wa.me/5521982232973?text=Ol%C3%A1%2C%20Lima%20Digital!" target="_blank" rel="noopener">Falar no WhatsApp</a>
      </div>
      <p class="ok-links"><a class="link" href="/#servicos">Serviços</a><a class="link" href="/#exemplos">Exemplos de sites</a><a class="link" href="/#contato">Contato</a></p>
    </div>
  </div>
</main>
</body>
</html>
